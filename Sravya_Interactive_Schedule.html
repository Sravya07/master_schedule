<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sravya · Night-Shift Operating System v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12141c; --panel:#1a1d29; --panel2:#212536; --line:#2e3247;
  --text:#e8e9f0; --dim:#8b90a8;
  --gold:#f0b95c; --prep:#7aa2f7; --fit:#73c991; --care:#e8a0bf;
  --work:#565b73; --rest:#9d8cff; --drink:#6dd3ce; --ankle:#ff9e64;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;line-height:1.5}
header{padding:20px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.htext{flex:1}
.brand{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
h1{font-size:22px;font-weight:700;margin-top:4px}
h1 span{color:var(--dim);font-weight:400}
.sub{font-size:12px;color:var(--dim);margin-top:2px}
#menuBtn{background:var(--panel2);border:1px solid var(--line);color:var(--gold);border-radius:10px;padding:10px 14px;font-size:13px;cursor:pointer;font-family:'IBM Plex Mono',monospace;white-space:nowrap}

.phasebar{display:flex;gap:6px;padding:12px 16px 2px;overflow-x:auto}
.phasebar .lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);align-self:center;flex-shrink:0;margin-right:2px}
.pchip{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.pchip.active{border-color:var(--drink);color:var(--drink);background:var(--panel2)}

.weeknav{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
.weeknav button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 14px;font-size:16px;cursor:pointer}
.weeklabel{flex:1;text-align:center}
.weeklabel .wk{font-weight:700;font-size:15px}
.weeklabel .ph{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);display:inline-block;margin-top:3px}
.ph.p0{color:#ff9e64;border-color:#ff9e6455}.ph.p1{color:var(--fit);border-color:#73c99155}
.ph.p2{color:var(--prep);border-color:#7aa2f755}.ph.p3{color:var(--rest);border-color:#9d8cff55}

.daytabs{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
.daytab{flex:1;min-width:44px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;cursor:pointer;color:var(--dim)}
.daytab .d{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase}
.daytab .n{font-size:15px;font-weight:700;color:var(--text)}
.daytab .s{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--gold)}
.daytab.active{background:var(--panel2);border-color:var(--gold)}
.daytab.active .n,.daytab.active .d{color:var(--gold)}

.daynote{margin:4px 16px 10px;padding:10px 12px;background:var(--panel);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;font-size:13px;color:var(--dim)}
.daynote b{color:var(--text)}

.timeline{padding:0 16px 40px}
.slot{display:flex;gap:12px;margin-bottom:8px}
.slot .time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);width:64px;flex-shrink:0;padding-top:14px;text-align:right}
.card{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;border-left-width:4px}
.card.prep{border-left-color:var(--prep)}.card.fit{border-left-color:var(--fit)}
.card.care{border-left-color:var(--care)}.card.work{border-left-color:var(--work)}
.card.meal{border-left-color:var(--gold)}.card.rest{border-left-color:var(--rest)}
.card.drink{border-left-color:var(--drink)}.card.ankle{border-left-color:var(--ankle)}
.card summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card summary::-webkit-details-marker{display:none}
.card .t{font-weight:500;font-size:14px}
.card .tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);flex-shrink:0}
.card .chev{color:var(--dim);transition:transform .18s;flex-shrink:0}
.card[open] .chev{transform:rotate(90deg)}
.detail{padding:0 14px 14px;font-size:13px;color:var(--dim);border-top:1px dashed var(--line)}
.detail ol,.detail ul{padding-left:18px;margin-top:8px}
.detail li{margin-bottom:5px}
.detail b{color:var(--text);font-weight:500}
.detail .why{margin-top:10px;padding:8px 10px;background:var(--panel2);border-radius:8px;font-size:12px}
.detail .why::before{content:"why · ";font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.detail .alt{margin-top:10px;padding:8px 10px;background:var(--panel2);border-radius:8px;font-size:12px}
.detail .alt::before{content:"swap options · ";font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--drink)}
.macro{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);margin-top:8px}

/* ---- Reference drawer ---- */
#drawer{position:fixed;inset:0;background:var(--ink);z-index:50;display:none;flex-direction:column}
#drawer.open{display:flex}
.dhead{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:16px;flex:1}
#closeD{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 14px;cursor:pointer}
.dtabs{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid var(--line)}
.dtab{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:7px 13px;font-size:12px;cursor:pointer;white-space:nowrap}
.dtab.active{border-color:var(--gold);color:var(--gold);background:var(--panel2)}
#dcontent{flex:1;overflow-y:auto;padding:16px;font-size:13px;color:var(--dim);max-width:720px;margin:0 auto;width:100%}
#dcontent h3{color:var(--text);font-size:15px;margin:18px 0 6px}
#dcontent h4{color:var(--gold);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin:14px 0 4px}
#dcontent ul,#dcontent ol{padding-left:18px;margin:6px 0}
#dcontent li{margin-bottom:4px}
#dcontent b{color:var(--text)}
#dcontent table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
#dcontent th,#dcontent td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
#dcontent th{color:var(--gold);font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.srcnote{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--drink);margin-bottom:10px}
@media(prefers-reduced-motion:reduce){.card .chev{transition:none}}
@media(min-width:760px){.timeline{max-width:680px;margin:0 auto}.daytabs,.weeknav,.phasebar{max-width:712px;margin:0 auto}.daynote{max-width:680px;margin:4px auto 10px}}
</style>
</head>

   mens-fixed override, luteal every-3rd-day ashwagandha override) but driven by the
   LIVE phase chip rather than an assumed calendar mapping, since real PCOS cycles are

function cycleDrink(dt){

  if(cyc==='mens')return'Ajwain + ginger water';
  if(cyc==='lute'&&n%3===0)return'Ashwagandha warm water (in warm soy milk)';
  return DRINK_POOL[n%6];
}

  return{t:'Study · '+(isGoogleWeek?'[GOOGLE] AI Fluency + ':'')+'DSA ('+d1+') + '+(alt?'System Design':'GenAI track'),c:'prep',d:'<ul><li><b>DSA (Java) 50 min</b> — 1 new + 1 error-log redo · topic: '+d1+'</li><li><b>'+(alt?'System Design 40 min — '+s1+'; anchor to your production systems':'GenAI/Backend 40 min — Track 5: agentic patterns, evals, serving')+'</b></li>'+googleAI+'</ul><div class="why">Fed + post-exercise ≈ peak focus window per your lifestyle plan. SD and GenAI alternate by day; DSA is daily and is the last block you\u2019re allowed to cut.'+(isGoogleWeek?' — AI fluency is the new gate for Google (H2 2026 rollout for mid-level roles). Your Arhasi LLM routing experience is gold here.':'')+'</div>'};
}

/* ---------- FIXED DAY PIECES ---------- */
const HOBBY={t:'Hobby buffer · painting / reading / sewing',c:'rest',d:'<ul><li>Or a 15-min stroll — this buffer measurably lowers pre-work anxiety</li><li>Flow state = cortisol drop; guard this slot</li></ul>'};
const READY={t:'Get ready + 4-7-8 breathing',c:'rest',d:'<ul><li>Pack dinner + 5:30 snack · freshen up</li><li><b>4-7-8 breathing</b> (4 in · 7 hold · 8 out) ×4 — non-negotiable pre-work anxiety reset</li></ul>'};
const WORKBLOCK={t:'Work · Arhasi (3 PM – 1 AM)',c:'work',d:'<ul><li>Cold water bottle at desk — 2–3 L across the shift</li><li>No caffeine after dinner — tulsi or chamomile only</li><li>~10:30 PM: 5-min walk + ankle circles (glucose disposal + stiffness)</li></ul>'};
function windDown(day){
  const slots=[];
  slots.push(['1:00',{t:'Work ends · optional seed snack',c:'meal',d:'<ul><li>If hungry: small handful pumpkin/sunflower seeds — magnesium for sleep + anxiety</li><li>Nothing else — the 12-hr overnight fast to breakfast protects insulin sensitivity</li></ul>'}]);
  slots.push(['1:10',{t:'PM skincare'+(day===5?' + weekly clay mask':''),c:'care',d:skinPM(day)}]);
  slots.push(['1:25',{t:'Diary + ankle bed mobility · no screens',c:'rest',d:'<ul><li>Brain-dump the day — measurably reduces next-day anxiety</li>'+ankleBed+'<li>Dim lights · novel, not phone · cooler room (hyperhidrosis + deeper sleep)</li></ul>'}]);
  if(day===4)slots.push(['1:35',OILNIGHT]);

}

/* ---------- DAY BUILDER ---------- */
function buildDay(dt){
  const ph=phaseOf(dt),day=(dt.getDay()+6)%7,wk=Math.floor((dt-START)/6048e5)+1,ap=anklePhaseOf(dt);
  const A=(day===0||day===2||day===4); const slots=[];let note='';
  const S=(t,c)=>{if(c)slots.push([t,c]);};

  if(ph==='p0'&&day===5){
    note='<b>EXAM DAY · SAP-C02.</b> Strategy: read fully, no rushing · easy 1–1.5 min · medium 2–3 min · hard = FLAG immediately → skip → return in final 30 · finish all 75 in 150 min. Hair wash moves to tomorrow this one week.';
    S('8:00',{t:'Wake + '+cycleDrink(dt)+' + AM skincare',c:'drink',d:'<ul><li>On waking, before anything else</li></ul>'+skinAM});
    S('8:30',mealCard('bf',dt,5));
    S('9:15',{t:'NO studying — mental prep only',c:'prep',d:'<ul><li>The official plan is explicit: do not study on exam day. Rest + 4-7-8 breathing.</li><li>You\u2019ve done 400+ questions. Trust the training.</li></ul>'});
    S('exam',{t:'SAP-C02 — target 750+',c:'prep',d:'<ul><li>FLAG→SKIP→RETURN on anything &gt; 3 min</li><li>Finish in 150 · review flagged in final 30 with fresh mind</li><li>Domain 4 went 60% → 77.78% with focused work — the same happened to D1/D3 this week.</li></ul>'});
    S('after',{t:'Celebrate + true rest',c:'rest',d:'<ul><li>No study, no workout · something joyful</li></ul>'});
    return{note,slots};
  }
  if(ph==='p0'&&day===6){
    note='Post-exam Sunday: hair wash (moved), Sunday batch prep, and the interview sprint + Month-1 workouts start Monday. Ankle: Phase 3 begins — progressive strengthening.';
    S('9:30',morningDrink(dt)); S('9:45',ankleMorning(ap));
    S('10:00',mealCard('bf',dt,6)); if(!planDay(dt))S('10:15',seedCard());
    S('11:00',{t:'Hair wash · Sebamed + Livon + clay mask',c:'care',d:'<ul><li>'+HAIR[5]+'</li></ul>'+skinPM(5)});
    S('12:30',ankleBalance(ap));
    S('1:30',mealCard('lu',dt,6));
    S('3:00',{t:'Sunday batch prep',c:'rest',d:'<ul><li>Ragi ladoos ×14 · boiled eggs ×6 · sprouted moong · pesarattu batter · grind flax</li><li>Soak overnight: almonds 6–8 + methi seeds 1 tsp (separate bowls)</li></ul>'});
    S('5:00',{t:'Weekly review · 15 min',c:'rest',d:'<ul><li>Baseline weight logged · ankle Phase-2 exit check: balance 30+ s · "different" feeling 7–8/10 · zero swelling · 15-min walk comfortable</li><li>Order resistance bands if not yet done (₹300–500, Amazon.in — essential for ankle Phase 3)</li></ul>'});
    S('7:30',mealCard('di',dt,6)); S('11:30',{t:'PM skincare + early sleep',c:'care',d:skinPM(6)});
    return{note,slots};
  }

  S('9:00',morningDrink(dt));
  S('9:10',ankleMorning(ap));

  if(ph==='p0'){
    note='<b>Cert sprint — the 9-day plan owns every study minute.</b> D1 (30.77%) + D3 (36%) are the critical gaps; D4 is already strong. Fitness = ankle protocol only. '+ANKLE_NAME[ap]+'.';
    S('9:20',mealCard('bf',dt,day)); if(!planDay(dt))S('9:35',seedCard());
    S('10:00',awsCard(dt,'am'));
    S('11:30',{t:day in HAIR?'Shower + hair wash':'Shower (hair rest day)',c:'care',d:day in HAIR?'<ul><li>'+HAIR[day]+'</li></ul>':'<ul><li>Cool/lukewarm only — hyperhidrosis rule</li></ul>'});
    S('12:00',awsCard(dt,'pm'));
    S('1:15',ankleBalance(ap));
    S('1:30',mealCard('lu',dt,day));
    S('2:45',READY); S('3:00',WORKBLOCK);
    S('5:15',ankleEvening(ap,day));
    S('5:30',snack530(dt,day));
    S('7:30',Object.assign({},mealCard('di',dt,day),{t:mealCard('di',dt,day).t.replace('Dinner at work','Dinner break 7:30–8:30')}));
    windDown(day).forEach(s=>slots.push(s));
    return{note,slots};
  }

  if(day===5){
    note=(ph==='p2')?'<b>Mock-interview Saturday.</b> Camera on, timed, real conditions. Schedule B: breakfast → digest → movement. '+ANKLE_NAME[ap]+'.':'Schedule B Saturday: breakfast → digest → dance/yoga · deep-work afternoon. '+ANKLE_NAME[ap]+'.';
    S('9:20',mealCard('bf',dt,5)); if(!planDay(dt))S('9:35',seedCard());
    S('9:40',{t:'Eat · rest · digest (60–70 min)',c:'rest',d:'<ul><li>Novel, journal, or just sit — low-intensity movement needs a fed gap</li></ul>'});
    S('10:30',fitCard(ph,wk,5,ap));
    S('11:15',{t:'Shower + hair wash · Sebamed + Livon',c:'care',d:'<ul><li>'+HAIR[5]+'</li></ul><div class="alt">Optional pre-wash: weekly SCALP glycolic — cotton pad on scalp sections (not lengths), 5–10 min max, then shampoo out. Keep on a different day from any face-glycolic night.</div>'});
    S('12:30',ankleBalance(ap));
    S('12:45',ph==='p2'?{t:'Mock interview · 60 min + 30 min debrief',c:'prep',d:'<ul><li>Alternate weekly: DSA mock ↔ system-design mock</li><li>Debrief immediately into the error log</li><li>Focus: Nvidia (wks 9–10) → Microsoft (11–12) → Google (13–15)</li></ul>'}:{t:'Deep revision block · 2 hrs',c:'prep',d:'<ul><li>Redo the week\u2019s hardest problems from scratch</li><li>One timed system-design write-up</li></ul>'});
    S('1:30',mealCard('lu',dt,5));
    S('2:30',{t:'Hobby · sewing / painting / die-cast time',c:'rest',d:'<ul><li>Protected joy slot — flow state is cortisol treatment</li></ul>'});
    S('4:30',ph!=='p3'?{t:'Behavioral prep · 45 min',c:'prep',d:'<ul><li>STAR stories: Data Steward agent · Redis Streams pipeline · multi-cloud routing</li><li>Your production war stories ARE the differentiator</li></ul>'}:{t:'Free afternoon',c:'rest',d:'<ul><li>Phase 3 earns leisure back</li></ul>'});
    S('5:15',ankleEvening(ap,5));
    S('5:30',snack530(dt,5));
    S('7:30',Object.assign({},mealCard('di',dt,5),{t:'Home dinner · light dal rice + methi'}));
    S('11:00',{t:'PM skincare + weekly clay mask',c:'care',d:skinPM(5)});
    S('11:20',{t:'Ankle bed mobility + sleep — fixed window',c:'rest',d:'<ul>'+ankleBed+'<li>Consistent wake anchors the nervous system even on weekends</li></ul>'});
    return{note,slots};
  }
  if(day===6){
    note='Complete rest + Sunday batch prep. No shampoo, no oil, no training, no study guilt. Ankle: circles + P&amp;F still run (daily bookends); optional balance only.';
    S('9:20',mealCard('bf',dt,6)); if(!planDay(dt))S('9:35',seedCard());
    S('10:30',{t:'Gentle walk (optional) · diary review',c:'rest',d:'<ul><li>Only if desired · painting or reading otherwise</li></ul>'});
    S('12:30',{t:'Ankle · optional balance (rest-day dose)',c:'ankle',d:'<ul><li>Standing single-leg balance 20–30 s × 4–5 — optional today per plan (Sunday = ankle rest day)</li></ul>'});
    S('1:30',mealCard('lu',dt,6));
    S('3:00',{t:'Sunday batch prep',c:'rest',d:'<ul><li>Ragi ladoos ×14 · boiled eggs ×6 · sprouted moong · pesarattu batter · grind flax</li><li>Soak overnight: almonds 6–8 + methi seeds 1 tsp (separate bowls)</li><li>Palak: buy half now, half mid-week (wilts by day 3)</li></ul>'});
    S('5:00',{t:'Weekly review · 15 min',c:'rest',d:'<ul><li><b>Log:</b> Saturday weight · workouts /5 active days · study hrs · <b>ankle: balance hold sec + "different" feeling /10 + swelling + pain</b> · cycle phase</li><li>2+ wks stalled weight → recheck portions · missed workouts → shrink, never skip · backlog → cut GenAI first, never DSA</li></ul>'});
    S('5:30',snack530(dt,6));
    S('7:30',Object.assign({},mealCard('di',dt,6),{t:'Home dinner · jowar roti + palak dal'}));
    S('11:00',{t:'PM skincare + early sleep',c:'care',d:skinPM(6)});
    return{note,slots};
  }

  note=(A?'<b>Schedule A</b> — light snack → strength → post-workout breakfast. ':'<b>Schedule B</b> — full breakfast → digest → gentle movement. ')+ANKLE_NAME[ap]+'. ';
  if(ph==='p1')note+=(wk<=2?'Month-1 Week-1 "Reawaken" + deficit starts. Rule: soreness that stops tomorrow\u2019s session = too hard.':'Month-1 progression. Ankle Phase-3 criteria (not vibes) gate the harder moves.');
  if(ph==='p2'){
    note+='Interview peak. <b>Interview-week override:</b> real loop week → 2 maintenance workouts · targeted prep only · sleep by 12:30 · maintenance calories ±3 days.';
    if(wk===7)note+=' <span style="color:var(--drink);font-weight:700;display:block;margin-top:8px">⚠️ CHECKPOINT: Verify current interview formats. Check Exponent Google 2026 · IGotAnOffer Microsoft/Nvidia guides. Watch for Nvidia team-specific changes, Microsoft Copilot scope, Google code-comprehension pilot expansion.</span>';
    if(wk===10)note+=' <span style="color:var(--drink);font-weight:700;display:block;margin-top:8px">⚠️ PRE-MICROSOFT: Verify if your team uses AI-assisted rounds (Copilot in VS Code). Ask recruiter explicitly — scope is still team-specific.</span>';
    if(wk===12)note+=' <span style="color:var(--drink);font-weight:700;display:block;margin-top:8px">⚠️ PRE-GOOGLE: Confirm code-comprehension round is in your loop. Gemini fluency + AI output validation = differentiator. Weave your Arhasi LLM routing war stories in.</span>';
  }
  if(ph==='p3')note+='Fitness-dominant: progressive overload logged every session; deficit to 15 kg (~March) then reverse-diet.';

  if(A){
    const pw=preworkCard(dt);
    S('9:20',pw||{t:'Pre-workout light snack · '+WEEKMEALS[day].pre,c:'meal',d:'<ul><li><b>'+WEEKMEALS[day].pre+'</b></li><li>40-min gap before lifting</li></ul><div class="why">Never train fully fasted — it worsens insulin resistance. The full breakfast comes AFTER the workout.</div>'});
    S('10:00',fitCard(ph,wk,day,ap));
    S('10:55',{t:day in HAIR?'Cool shower + hair wash':'Cool shower',c:'care',d:day in HAIR?'<ul><li>Lukewarm only (hyperhidrosis) · dry fully</li><li>'+HAIR[day]+'</li></ul>':'<ul><li>Lukewarm only · dry fully</li></ul>'});
    S('11:20',mealCard('bf',dt,day)); if(!planDay(dt))S('11:35',seedCard());
    S('12:00',studyCard(ph,wk,day));
  }else{
    S('9:20',mealCard('bf',dt,day)); if(!planDay(dt))S('9:35',seedCard());
    S('9:40',{t:'Eat · rest · digest (60–70 min)',c:'rest',d:'<ul><li>Novel, journal, sit — the fed gap makes 10:30 movement safe</li></ul>'});
    S('10:30',fitCard(ph,wk,day,ap));

    S('11:30',studyCard(ph,wk,day));
  }
  S('1:15',ankleBalance(ap));
  S('1:30',mealCard('lu',dt,day));
  S('2:15',HOBBY);
  S('2:45',READY);
  S('3:00',WORKBLOCK);
  S('5:15',ankleEvening(ap,day));
  S('5:30',snack530(dt,day));
  S('7:30',Object.assign({},mealCard('di',dt,day),{t:mealCard('di',dt,day).t.replace('Dinner at work','Dinner break 7:30–8:30')}));
  windDown(day).forEach(s=>slots.push(s));
  return{note,slots};
}

+'<h3>Where you stand</h3><table><tr><th>Domain</th><th>Score</th><th>Status</th></tr><tr><td>1 · Org Complexity</td><td>30.77%</td><td>🔴 CRITICAL — heavy drilling Days 1–2</td></tr><tr><td>2 · New Solutions</td><td>50%</td><td>🟡 Moderate</td></tr><tr><td>3 · Continuous Improvement</td><td>36%</td><td>🔴 CRITICAL — optimization patterns</td></tr><tr><td>4 · Migration</td><td>77.78%</td><td>✅ Strong (was 60%)</td></tr></table>'
+'<p>Baseline TD Timed Set 1: 45% · adjusted capability ~60–68% · target 750/1000 · pass probability with plan: 60–70%.</p>'
+'<h3>Time management (the real enemy)</h3><ul><li>2.4 min/question (75 Q / 180 min) · easy 1–1.5 min · medium 2–3 min · hard: <b>FLAG immediately → skip → return in final 30</b> · finish all 75 in 150 min</li></ul>'

meals:{name:'Meals & Macros',html:'<div class="srcnote">Source: 3-Month Meal Plan (3month_meal_plan.html) — supersedes the old weekly grid · Day 1 = Aug 17, 2026 · Day 91 = Nov 15, 2026</div>'
+'<p style="color:var(--text);margin-bottom:10px">This is now the live source for breakfast/lunch/dinner/snack in the schedule above — 91 unique day-by-day combos, no repeat within a month. Push <code>3month_meal_plan.html</code> into the repo alongside this schedule to open the full day-by-day table directly.</p>'
+'<h3>Daily rules (all 91 days)</h3><ul><li>Soy milk everywhere — no dairy milk (yogurt 3 tbsp/meal still used, not counted as dairy)</li><li>Ghee max 1 tsp/day, lunch tadka only · dinner uses ½ tsp groundnut oil instead</li><li>No upma anywhere, in any form</li><li>Brown rice is the only rice — no millet substitution (basmati only for Sat biryani/fried-rice specials)</li><li>Roti = jowar roti ×2 or whole-wheat chapathi ×2 only</li><li>Lunch carries 2 boiled eggs (added after a macro check showed the day running ~20–25 g short of 85–95 g protein target)</li><li>Sprouts + 1 fruit + 6–8 soaked almonds + 3 soaked walnuts — every day\u2019s snack, no exceptions</li><li>Tea/coffee gap now 30 min after meals (relaxed from 60 — iron levels improved)</li><li>Lunch + dinner share the same cooked curry — ~47% of days use soy chunks (nutrela) instead of dal for higher protein density</li></ul>'
+'<h3>Iron-focus day</h3><ul><li><b>Wednesday only</b> 🔴 — deliberate iron-stacking. All other days: iron comes from background foods (dal, eggs, oats, seeds) with no extra stacking.</li></ul>'
+'<h3>Egg cap</h3><ul><li>2–3 eggs/day, shown in each day\u2019s header. Soy-chunks days = 2 eggs · dal days = 3 eggs (dal is less protein-dense, extra egg compensates).</li></ul>'
+'<h3>Morning drink — cycle-synced (computed live, not fixed per day)</h3><ul><li><b>Menstruation:</b> Ajwain + ginger water, fixed every day (cramp relief takes priority)</li><li><b>Follicular + Ovulation:</b> 6-drink rotation — Warm lemon → Jeera → Methi seed → Amla juice → Spearmint → Hibiscus, position advances daily and doesn\u2019t reset each cycle</li><li><b>Luteal:</b> same 6-drink rotation, except every 3rd day (by absolute day count) swaps to Ashwagandha warm water (in soy milk) for cortisol support</li></ul>'
+'<h3>Seed cycling — corrected grouping</h3><ul><li><b>Menstruation + Follicular + Ovulation:</b> 1 tbsp flaxseed + 1 tbsp pumpkin seeds, daily in breakfast</li><li><b>Luteal only:</b> 1 tbsp sesame + 1 tbsp sunflower seeds</li><li>(Note: earlier versions of this schedule incorrectly grouped ovulation with luteal for seed cycling — this is now fixed to match the source plan\u2019s explicit grouping.)</li></ul>'
+'<h3>Fruit — weekly rotation, cycle-synced</h3><ul><li><b>Menstruation:</b> guava every day (highest Vit C, maximises iron absorption when needed most)</li><li><b>Otherwise:</b> 6-fruit pool rotates weekly (not daily) — guava → apple → pear → fresh amla → pomegranate → orange</li></ul>'
+'<h3>Schedule A vs B breakfast structure</h3><ul><li><b>Sch A (Mon/Wed/Fri):</b> pre-workout snack at 9:20 AM (dashed box) + full post-workout breakfast at 11:20 AM</li><li><b>Sch B (Tue/Thu/Sat/Sun):</b> single full breakfast at 9:20 AM, exercise follows at 10:30 AM after digestion rest</li></ul>'
+'<h3>Portion anchors</h3><ul><li>¾ c grain ≈ 140 g cooked · ½ c dal ≈ 120 g cooked · 2 medium roti/chapathi ≈ 60 g dry flour · yogurt 3 tbsp ≈ 45 g</li></ul>'
+'<h3>Cycle phase overlay (layered on top of the day\u2019s listed meals)</h3><ul><li><b>Menstruation:</b> extra lemon on iron meals · amla juice even on non-iron days · swap dinner grain to ragi roti if possible · avoid salty/spicy + caffeine + large yogurt portions</li><li><b>Follicular:</b> spearmint 2 cups · add cruciferous veg to lunches missing it · tofu 2–3×/week at dinner · best phase for heavier strength + trying new meals</li><li><b>Ovulation:</b> turmeric + black pepper on cooked dishes · zinc focus (pumpkin+sesame in oats) · raw salad up to 1 c at dinner · avoid refined sugar + excess caffeine</li><li><b>Luteal:</b> extra protein at breakfast (2 eggs on A pre-workout days) · extra magnesium (pumpkin seeds in snack) · reduce salt + total carbs slightly (IR peaks) · swap sugar cravings for ragi ladoo/dates+nuts</li></ul>'
+'<div class="alt">Because PCOS cycles are irregular (35–55+ days), phases can\u2019t be pre-mapped to fixed calendar dates. The schedule above uses whichever phase chip you select, not a fixed day-count — match it to your tracking app (Clue/Flo) each day.</div>'},
life:{name:'Lifestyle Daily',html:'<div class="srcnote">Source: Lifestyle Plan — two morning variants; rest of day fixed</div>'
+'<h3>Schedule A — strength days (Mon/Wed/Fri)</h3><table><tr><th>Time</th><th>Block</th></tr><tr><td>9:00</td><td>Wake + lemon water · sunlight · light stretch</td></tr><tr><td>9:20</td><td>Light snack (½ oats + egg, or ladoo + almonds · ~150–200 kcal)</td></tr><tr><td>10:00</td><td>Strength 45–50 min (40-min gap after snack is safe)</td></tr><tr><td>10:55</td><td>Cool shower (hyperhidrosis)</td></tr><tr><td>11:20</td><td>FULL breakfast post-workout</td></tr><tr><td>12:00</td><td>Study / job prep — fed + post-exercise = peak focus</td></tr></table>'

+'<h3>Weekly workout pattern</h3><ul><li>Mon lower · Tue restorative yoga · Wed upper+core · Thu walk · Fri full-body circuit · Sat dance/vinyasa · Sun rest</li><li>Never train fully fasted · avoid hot/humid · avoid HIIT (cortisol) · strength = primary IR intervention (4–6 wks to effect)</li></ul>'
+'<h3>Health pillars</h3><ul><li><b>Anemia:</b> iron + Vit C pairing always · ragi daily · gongura/methi/palak/curry leaves · cast-iron kadai · no tea/coffee ±1 hr of meals · ferritin every 3 months</li><li><b>Hyperhidrosis:</b> cool environment · lukewarm showers · cotton · aluminium chloride at night · anxiety is a trigger</li><li><b>Anxiety:</b> 4-7-8 pre-work · diary nightly · painting flow · consistent wake time · tulsi/chamomile at work · no doom-scrolling after 11</li><li><b>Supplements to discuss with doctor:</b> iron+C (per ferritin) · myo+D-chiro inositol 40:1 · D3 · magnesium glycinate · B12 · omega-3</li><li><b>Tests:</b> ferritin/serum iron/TIBC · fasting insulin + HbA1c · D3 + B12 · thyroid panel · AMH + Day-2/3 hormones yearly</li></ul>'},
workout:{name:'Workout Month-1',html:'<div class="srcnote">Source: Month 1 Workout Plan — Reawaken → Foundation → Build → Full programme</div>'
+'<h3>Week 1 · Reawaken (15–25 min · 3/10 · no equipment)</h3><ul><li>Mon walk 20 + 4-7-8 · Tue mobility (cat-cow, child\u2019s pose, hip circles, ankle rolls) · Wed gentle yoga 20 · Thu walk 25 + calf raises · Fri full-body stretch · Sat longer walk 25 · Sun rest + diary</li><li>Rule: soreness that stops tomorrow\u2019s session = too hard. PCOS + anemia recovery is slower — feel energised after, not depleted.</li></ul>'
+'<h3>Week 2 · Foundation (25–35 min · 4/10 · bodyweight)</h3><ul><li>Mon lower (squats 3×10, bridge 3×12, calf 2×15, wall sit) · Tue yoga + Nadi Shodhana · Wed upper+core (wall push-up, dead bug, superman) · Thu walk 30 · Fri full body · Sat yin yoga · Sun rest</li><li>Rule: 3 s down, pause, 2 s up. Tempo is the training tool, not load.</li></ul>'
+'<h3>Week 3 · Build (35–45 min · 5–6/10 · loop band)</h3><ul><li>Mon lower+band (band squat, RDL, lateral walks, single-leg bridge) · Tue strength yoga · Wed upper+band (knee push-up, pull-apart, plank, band OHP) · Thu incline walk · Fri circuit ×3 · Sat restorative + yoga nidra · Sun rest</li><li>Buy loop band ₹200–400 · mild burn on last rep = target</li></ul>'
+'<h3>Week 4 · Full programme (40–50 min · 6–7/10 · 2–4 kg dumbbells)</h3><ul><li>Mon lower+DB (goblet squat, RDL, reverse lunge, band bridge, slow calf) · Tue full yoga · Wed upper+DB (push-up, seated press, bent-over row, plank, slow dead bug) · Thu power walk · Fri circuit wk4 · Sat flow + Nadi Shodhana · Sun rest + month review</li><li>Rule: start 2 kg — lighter than you think. Perfect form now = safe overload in Month 2.</li></ul>'},

/* ---------- RENDER ---------- */
let curWeek=0,curDay=0;
const wkStart=w=>new Date(START.getTime()+w*6048e5);
const fmt=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
function render(){
  const s=wkStart(curWeek),e=new Date(s.getTime()+5184e5);
  document.getElementById('wkLabel').textContent='Week '+(curWeek+1)+' · '+fmt(s)+' – '+fmt(e);
  const ph=phaseOf(new Date(s.getTime()+3*864e5)),meta=PHASE_META[ph];
  const pl=document.getElementById('phLabel');pl.textContent=meta[0];pl.className='ph '+meta[1];
  const tabs=document.getElementById('dayTabs');tabs.innerHTML='';
  for(let i=0;i<7;i++){const d=new Date(s.getTime()+i*864e5);
    const b=document.createElement('button');b.className='daytab'+(i===curDay?' active':'');
    const sched=(ph!=='p0'&&(i===0||i===2||i===4))?'A':(ph!=='p0'?'B':'');
    b.innerHTML='<div class="d">'+DAYS[i]+'</div><div class="n">'+d.getDate()+'</div><div class="s">'+sched+'</div>';
    b.onclick=()=>{curDay=i;render();};tabs.appendChild(b);}
  const dt=new Date(s.getTime()+curDay*864e5),res=buildDay(dt);
  document.getElementById('dayNote').innerHTML=res.note+'<br><span style="color:var(--drink)">Cycle: '+CYCNAME[cyc]+' — drink + seeds + meal picks follow it. Tap chips above to switch. · ☰ Plans = original docs.</span>';
  const tl=document.getElementById('tl');tl.innerHTML='';
  res.slots.forEach(pair=>{
    const time=pair[0],card=pair[1];
    const row=document.createElement('div');row.className='slot';
    row.innerHTML='<div class="time">'+time+'</div><details class="card '+card.c+'"><summary><span class="t">'+card.t+'</span><span class="tag">'+card.c+'</span><span class="chev">›</span></summary><div class="detail">'+card.d+'</div></details>';
    tl.appendChild(row);});
}
/* drawer */
const dtabs=document.getElementById('dtabs'),dcontent=document.getElementById('dcontent');
let curRef='skin';
function renderDrawer(){
  dtabs.innerHTML='';
  Object.keys(REF).forEach(k=>{
    const b=document.createElement('button');b.className='dtab'+(k===curRef?' active':'');
    b.textContent=REF[k].name;b.onclick=()=>{curRef=k;renderDrawer();};dtabs.appendChild(b);});
  dcontent.innerHTML=REF[curRef].html;dcontent.scrollTop=0;
}
document.getElementById('menuBtn').onclick=()=>{document.getElementById('drawer').classList.add('open');renderDrawer();};
document.getElementById('closeD').onclick=()=>document.getElementById('drawer').classList.remove('open');
document.querySelectorAll('.pchip').forEach(ch=>ch.onclick=()=>{
  document.querySelectorAll('.pchip').forEach(c=>c.classList.remove('active'));
  ch.classList.add('active');cyc=ch.dataset.p;render();});
document.getElementById('prevW').onclick=()=>{if(curWeek>0){curWeek--;render();}};
document.getElementById('nextW').onclick=()=>{if(curWeek<TOTAL_WEEKS-1){curWeek++;render();}};
(()=>{const now=new Date();const diff=Math.floor((now-START)/864e5);
if(diff>=0&&diff<TOTAL_WEEKS*7){curWeek=Math.floor(diff/7);curDay=diff%7;}})();
render();
</script>
